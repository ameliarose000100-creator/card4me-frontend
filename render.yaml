services:
  - type: web
    name: card4me-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: MELE_API_TOKEN
        sync: false
      - key: FLW_CLIENT_ID
        sync: false
      - key: FLW_CLIENT_SECRET
        sync: false
      - key: FLW_BASE_URL
        value: https://developersandbox-api.flutterwave.com
      - key: FLW_REDIRECT_URL
        sync: false
      - key: FLW_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: static_site
    name: card4me-frontend
    buildCommand: echo "No build required"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
