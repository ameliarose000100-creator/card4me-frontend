<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>Create Account - CARD4ME</title>

    <link
        rel="stylesheet"
        href="style.css?v=20260921"
    >

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">


<style>
.password-field {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
}

.password-field input {
    width: 100%;
    padding-right: 54px !important;
}

.password-toggle {
    position: absolute !important;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px !important;
    min-width: 40px !important;
    min-height: 38px !important;
    height: 38px !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 8px !important;
    background: transparent !important;
    color: #35f5b0 !important;
    cursor: pointer;
    font-size: 19px !important;
    box-shadow: none !important;
}

.password-toggle:hover {
    transform: translateY(-50%) !important;
    background: rgba(53, 245, 176, 0.10) !important;
}

.reset-login-link {
    display: block;
    margin-top: 22px;
    color: #35f5b0;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
}

.reset-login-link:hover {
    text-decoration: underline;
}

.go-login-button {
    display: none;
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, #35f5b0, #12bd82);
    color: #02150e;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    text-decoration: none;
}
</style>

</head>

<body>

    <!-- ================================
         HEADER
    ================================= -->

    <header class="site-header">

        <a
            href="index.html"
            class="logo"
        >

            <span class="logo-mark">
                C4
            </span>

            CARD<span>4</span>ME

        </a>

    </header>


    <!-- ================================
         REGISTER SECTION
    ================================= -->

    <main class="auth-page">

        <section class="auth-card">

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Create your CARD4ME account to get started.
            </p>


            <!-- ================================
                 REGISTER FORM
            ================================= -->

            <form
                id="registerForm"
                onsubmit="registerUser(event)"
                autocomplete="on"
            >

                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        maxlength="150"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="08012345678"
                        autocomplete="tel"
                        maxlength="20"
                        inputmode="tel"
                        required
                    >

                </div>


                <!-- Referral Code -->

                <div class="form-group">

                    <label for="referralCode">
                        Referral Code <span class="optional-label">(Optional)</span>
                    </label>

                    <input
                        type="text"
                        id="referralCode"
                        name="referralCode"
                        placeholder="Enter referral code"
                        autocomplete="off"
                        maxlength="30"
                        style="text-transform: uppercase;"
                    >

                    <small class="form-hint">
                        Have a CARD4ME referral code? Enter it here.
                    </small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-field">
<input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="100"
                        required
                    >
<button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Show password">👁️</button>
</div>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-field">
<input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        maxlength="100"
                        required
                    >
<button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" aria-label="Show password">👁️</button>
</div>

                </div>


                <!-- Password message -->

                <p
                    id="passwordMessage"
                    class="form-message"
                    aria-live="polite"
                ></p>


                <!-- Register button -->

                <button
                    type="submit"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <!-- ================================
                 LOGIN LINK
            ================================= -->

            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- ================================
                 SECURITY NOTICE
            ================================= -->

            <div class="security-notice">

                <strong>
                    🔒 Security
                </strong>

                <p>
                    Your password is protected by the CARD4ME
                    backend. Never share your password with anyone.
                </p>

            </div>

        </section>

    </main>


    <!-- ================================
         APP JAVASCRIPT
    ================================= -->

    <script src="app.js"></script>


    <!-- ================================
         REGISTER SECURITY SCRIPT
    ================================= -->

    <script>

        (function () {

            "use strict";


            const form =
                document.getElementById(
                    "registerForm"
                );

            const button =
                document.getElementById(
                    "registerButton"
                );

            const password =
                document.getElementById(
                    "password"
                );

            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                );

            const passwordMessage =
                document.getElementById(
                    "passwordMessage"
                );


            let submitting = false;


            /* ================================
               PASSWORD MATCH CHECK
            ================================= */

            function checkPasswords() {

                if (
                    !password ||
                    !confirmPassword
                ) {

                    return true;

                }


                if (
                    confirmPassword.value &&
                    password.value !==
                    confirmPassword.value
                ) {

                    if (passwordMessage) {

                        passwordMessage.textContent =
                            "Passwords do not match.";

                    }

                    return false;

                }


                if (passwordMessage) {

                    passwordMessage.textContent =
                        "";

                }

                return true;

            }


            password?.addEventListener(
                "input",
                checkPasswords
            );


            confirmPassword?.addEventListener(
                "input",
                checkPasswords
            );


            /* ================================
               FORM SUBMISSION PROTECTION
            ================================= */

            form?.addEventListener(
                "submit",
                function (event) {

                    if (submitting) {

                        event.preventDefault();

                        return;

                    }


                    const fullName =
                        document
                            .getElementById(
                                "fullName"
                            )
                            ?.value
                            .trim();


                    const email =
                        document
                            .getElementById(
                                "email"
                            )
                            ?.value
                            .trim();


                    const phone =
                        document
                            .getElementById(
                                "phone"
                            )
                            ?.value
                            .trim();


                    const pass =
                        password?.value ||
                        "";


                    const confirm =
                        confirmPassword?.value ||
                        "";


                    /* ================================
                       BASIC VALIDATION
                    ================================= */

                    if (!fullName) {

                        event.preventDefault();

                        alert(
                            "Please enter your full name."
                        );

                        return;

                    }


                    if (!email) {

                        event.preventDefault();

                        alert(
                            "Please enter your email address."
                        );

                        return;

                    }


                    if (!phone) {

                        event.preventDefault();

                        alert(
                            "Please enter your phone number."
                        );

                        return;

                    }


                    if (pass.length < 6) {

                        event.preventDefault();

                        alert(
                            "Password must be at least 6 characters."
                        );

                        return;

                    }


                    if (pass !== confirm) {

                        event.preventDefault();

                        if (passwordMessage) {

                            passwordMessage.textContent =
                                "Passwords do not match.";

                        }

                        alert(
                            "Passwords do not match."
                        );

                        return;

                    }


                    /* ================================
                       PREVENT DOUBLE SUBMISSION
                    ================================= */

                    submitting = true;


                    if (button) {

                        button.disabled = true;

                        button.textContent =
                            "Creating Account...";

                    }


                    /* ================================
                       SAFETY UNLOCK
                    ================================= */

                    setTimeout(
                        function () {

                            submitting = false;


                            if (button) {

                                button.disabled =
                                    false;

                                button.textContent =
                                    "Create Account";

                            }

                        },
                        30000
                    );

                }
            );


            /* ================================
               PHONE INPUT CLEANUP
            ================================= */

            document
                .getElementById("phone")
                ?.addEventListener(
                    "input",
                    function () {

                        this.value =
                            this.value.replace(
                                /[^0-9+]/g,
                                ""
                            );

                    }
                );


            /* ================================
               IF ALREADY LOGGED IN
            ================================= */

            document.addEventListener(
                "DOMContentLoaded",
                function () {

                    try {

                        if (
                            typeof isLoggedIn ===
                                "function" &&
                            isLoggedIn()
                        ) {

                            window.location.href =
                                "dashboard.html";

                        }

                    } catch (error) {

                        console.warn(
                            "Authentication check unavailable."
                        );

                    }

                }
            );

        })();

    </script>


<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (!input) return;

    const isHidden = input.type === "password";

    input.type = isHidden ? "text" : "password";
    button.textContent = isHidden ? "🙈" : "👁️";
    button.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
    );
}
</script>

</body>

</html>
