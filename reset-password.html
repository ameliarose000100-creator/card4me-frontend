<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CARD4ME</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(0, 220, 160, 0.14),
                    transparent 38%
                ),
                linear-gradient(145deg, #020807, #061916 55%, #020504);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 520px;
        }

        .auth-card {
            width: 100%;
            padding: 38px 32px;
            border: 1px solid rgba(0, 255, 170, 0.22);
            border-radius: 26px;
            background: rgba(7, 27, 24, 0.94);
            box-shadow:
                0 0 35px rgba(0, 255, 170, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .brand {
            margin-bottom: 12px;
            color: #35f5b0;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            color: #ffffff;
            font-size: clamp(28px, 6vw, 38px);
            font-weight: 800;
            text-align: center;
        }

        .subtitle {
            margin: 0 auto 30px;
            max-width: 360px;
            color: #a7c2bb;
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            margin-top: 8px;
            color: #d5e9e3;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 56px;
            padding: 0 16px;
            border: 1px solid #254d43;
            border-radius: 13px;
            outline: none;
            background: #071814;
            color: #ffffff;
            font-size: 16px;
            transition: 0.2s ease;
        }

        input::placeholder {
            color: #6f9389;
        }

        input:focus {
            border-color: #35f5b0;
            box-shadow: 0 0 0 3px rgba(53, 245, 176, 0.12);
        }

        button {
            width: 100%;
            min-height: 56px;
            margin-top: 18px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #35f5b0, #12bd82);
            color: #02150e;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(53, 245, 176, 0.18);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }

        .alert {
            display: none;
            margin-top: 22px;
            padding: 15px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
        }

        .alert.show {
            display: block;
        }

        .alert.success {
            border: 1px solid rgba(53, 245, 176, 0.45);
            background: rgba(53, 245, 176, 0.10);
            color: #6dffc8;
        }

        .alert.error {
            border: 1px solid rgba(255, 94, 94, 0.45);
            background: rgba(255, 94, 94, 0.10);
            color: #ff9d9d;
        }

        .footer-text {
            margin: 26px 0 0;
            color: #72988e;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 420px) {
            body {
                padding: 16px 12px;
            }

            .auth-card {
                padding: 30px 22px;
                border-radius: 22px;
            }

            h1 {
                font-size: 29px;
            }

            .subtitle {
                margin-bottom: 24px;
            }
        }
    </style>

<style>
.password-field {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
}

.password-field input {
    width: 100%;
    padding-right: 54px !important;
}

.password-toggle {
    position: absolute !important;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px !important;
    min-width: 40px !important;
    min-height: 38px !important;
    height: 38px !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 8px !important;
    background: transparent !important;
    color: #35f5b0 !important;
    cursor: pointer;
    font-size: 19px !important;
    box-shadow: none !important;
}

.password-toggle:hover {
    transform: translateY(-50%) !important;
    background: rgba(53, 245, 176, 0.10) !important;
}

.reset-login-link {
    display: block;
    margin-top: 22px;
    color: #35f5b0;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
}

.reset-login-link:hover {
    text-decoration: underline;
}

.go-login-button {
    display: none;
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, #35f5b0, #12bd82);
    color: #02150e;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    text-decoration: none;
}
</style>

</head>

<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">CARD4ME DIGITAL ENTERPRISES</div>

            <h1>Reset Password</h1>

            <p class="subtitle">
                Create a new secure password for your CARD4ME account.
            </p>

            <form id="resetPasswordForm">
                <label for="password">New Password</label>

                <div class="password-field">
<input
                    type="password"
                    id="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                    placeholder="Enter new password"
                >
<button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Show password">👁️</button>
</div>

                <label for="confirmPassword">Confirm Password</label>

                <div class="password-field">
<input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    required
                    autocomplete="new-password"
                    placeholder="Confirm new password"
                >
<button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)" aria-label="Show password">👁️</button>
</div>

                <button type="submit" id="resetButton">
                    Reset Password
                </button>
            </form>

            <div
                id="resetMessage"
                class="alert"
                role="alert"
                aria-live="polite"
            ></div>

            <p class="footer-text">
                Your password must contain at least 8 characters.
            </p>
        </section>
    </main>

    <script>
        const form =
            document.getElementById("resetPasswordForm");

        const message =
            document.getElementById("resetMessage");

        const resetButton =
            document.getElementById("resetButton");

        const token =
            new URLSearchParams(window.location.search)
                .get("token");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "alert show " + type;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (!token) {
                showMessage(
                    "This reset link is invalid or missing.",
                    "error"
                );
                return;
            }

            if (password.length < 8) {
                showMessage(
                    "Password must contain at least 8 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "Passwords do not match. Please try again.",
                    "error"
                );
                return;
            }

            resetButton.disabled = true;
            resetButton.textContent = "Resetting Password...";

            message.className = "alert";

            try {
                const response = await fetch(
                    "https://card4me-backend-1.onrender.com/api/auth/reset-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token,
                            password
                        })
                    }
                );

                const result = await response.json();

                if (result.success) {
                    showMessage(
                        result.message ||
                        "Password reset successful. You can now log in.",
                        "success"
                    );

                    form.reset();
                    resetButton.textContent = "Password Reset Successful";

                    const goLoginButton =
                        document.getElementById("goLoginButton");

                    if (goLoginButton) {
                        goLoginButton.style.display = "block";
                    }
                } else {
                    showMessage(
                        result.message ||
                        "Unable to reset password. Please try again.",
                        "error"
                    );

                    resetButton.disabled = false;
                    resetButton.textContent = "Reset Password";
                }
            } catch (error) {
                showMessage(
                    "Unable to connect. Please check your internet connection and try again.",
                    "error"
                );

                resetButton.disabled = false;
                resetButton.textContent = "Reset Password";
            }
        });
    </script>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (!input) return;

    const isHidden = input.type === "password";

    input.type = isHidden ? "text" : "password";
    button.textContent = isHidden ? "🙈" : "👁️";
    button.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
    );
}
</script>

</body>
</html>
