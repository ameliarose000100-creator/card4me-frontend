<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Secure login to CARD4ME"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>Login — CARD4ME</title>

    <link
        rel="stylesheet"
        href="style.css?v=20260921"
    >

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">


<style>
.password-field {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
}

.password-field input {
    width: 100%;
    padding-right: 54px !important;
}

.password-toggle {
    position: absolute !important;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px !important;
    min-width: 40px !important;
    min-height: 38px !important;
    height: 38px !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    border-radius: 8px !important;
    background: transparent !important;
    color: #35f5b0 !important;
    cursor: pointer;
    font-size: 19px !important;
    box-shadow: none !important;
}

.password-toggle:hover {
    transform: translateY(-50%) !important;
    background: rgba(53, 245, 176, 0.10) !important;
}

.reset-login-link {
    display: block;
    margin-top: 22px;
    color: #35f5b0;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
}

.reset-login-link:hover {
    text-decoration: underline;
}

.go-login-button {
    display: none;
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border-radius: 12px;
    background: linear-gradient(135deg, #35f5b0, #12bd82);
    color: #02150e;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    text-decoration: none;
}
</style>

</head>


<body>


<header class="nav">

    <a
        class="logo"
        href="index.html"
        aria-label="CARD4ME Home"
    >
        CARD<span>4</span>ME
    </a>

</header>


<main class="page narrow">

    <small>WELCOME BACK</small>

    <h1>
        Login to CARD4ME
    </h1>

    <p>
        Access your wallet and digital services securely.
    </p>


    <section class="wallet-box">

        <form
            id="loginForm"
            autocomplete="on"
        >

            <label for="email">
                Email address
            </label>

            <input
                id="email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="username"
                maxlength="254"
                placeholder="you@example.com"
                required
            >


            <label for="password">
                Password
            </label>

            <div class="password-field">
<input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="6"
                maxlength="128"
                placeholder="Enter your password"
                required
            >
<button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Show password">👁️</button>
</div>


            <p style="text-align: right; margin: 8px 0 18px;">
                <a href="forgot-password.html">Forgot Password?</a>
            </p>


            <button
                id="loginButton"
                class="btn"
                type="submit"
            >
                Login
            </button>

        </form>

    </section>


    <p class="note">
        Don't have an account?
        <a href="register.html">
            Create an account
        </a>
    </p>


    <section
        class="wallet-box"
        style="margin-top:20px;"
    >

        <strong>
            🔒 Security
        </strong>

        <p class="note">
            Never share your CARD4ME password,
            verification codes, or login information
            with anyone.
        </p>

    </section>

</main>


<footer>

    <b>
        CARD<span>4</span>ME
    </b>

    <span>
        Secure digital services
    </span>

</footer>


<script src="app.js"></script>


<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (!input) return;

    const isHidden = input.type === "password";

    input.type = isHidden ? "text" : "password";
    button.textContent = isHidden ? "🙈" : "👁️";
    button.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
    );
}
</script>

</body>
</html>
