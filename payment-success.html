<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CARD4ME payment status."
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>Payment Status | CARD4ME</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================
         PAYMENT STATUS
    ================================== -->

    <main class="payment-status-page">


        <section class="payment-status-card">


            <!-- PAYMENT ICON -->

            <div
                id="paymentIcon"
                class="payment-status-icon"
            >
                ⏳
            </div>


            <!-- TITLE -->

            <h1 id="paymentTitle">
                Checking Payment
            </h1>


            <!-- MESSAGE -->

            <p id="paymentMessage">
                Please wait while CARD4ME confirms your payment.
            </p>


            <!-- PAYMENT DETAILS -->

            <div
                id="paymentDetails"
                class="payment-details"
            >
            </div>


            <!-- ACTIONS -->

            <div class="payment-status-actions">


                <a
                    href="wallet.html"
                    class="btn"
                    id="walletButton"
                    style="display:none;"
                >
                    Go to Wallet
                </a>


                <a
                    href="dashboard.html"
                    class="btn btn-outline"
                >
                    Dashboard
                </a>


            </div>


        </section>


    </main>



    <!-- =================================
         PAYMENT VERIFICATION
    ================================== -->

    <script>

        "use strict";


        /*
         * LIVE CARD4ME BACKEND
         */

        const CARD4ME_API =
            "https://card4me-backend.onrender.com";



        /*
         * PAGE ELEMENTS
         */

        const paymentTitle =
            document.getElementById(
                "paymentTitle"
            );


        const paymentMessage =
            document.getElementById(
                "paymentMessage"
            );


        const paymentIcon =
            document.getElementById(
                "paymentIcon"
            );


        const paymentDetails =
            document.getElementById(
                "paymentDetails"
            );


        const walletButton =
            document.getElementById(
                "walletButton"
            );



        /*
         * VERIFY PAYMENT
         */

        async function verifyPayment() {


            /*
             * Get payment information
             * saved before redirecting here.
             */

            const savedPayment =
                sessionStorage.getItem(
                    "card4me_payment"
                );


            /*
             * No payment information
             */

            if (!savedPayment) {

                paymentIcon.textContent =
                    "⚠️";

                paymentTitle.textContent =
                    "Payment Information Missing";

                paymentMessage.textContent =
                    "We could not find the payment information for this transaction.";

                return;

            }



            /*
             * Read saved payment information
             */

            let payment;


            try {

                payment =
                    JSON.parse(
                        savedPayment
                    );

            } catch (error) {

                console.error(
                    "Payment data error:",
                    error
                );


                paymentIcon.textContent =
                    "⚠️";

                paymentTitle.textContent =
                    "Invalid Payment Information";

                paymentMessage.textContent =
                    "The payment information could not be read.";

                return;

            }



            /*
             * Make sure transaction ID exists.
             */

            if (!payment.transactionId) {

                paymentIcon.textContent =
                    "⚠️";

                paymentTitle.textContent =
                    "Transaction ID Missing";

                paymentMessage.textContent =
                    "We could not find the payment transaction ID.";

                return;

            }



            /*
             * Ask the LIVE CARD4ME backend
             * to verify the payment.
             */

            try {

                const response =
                    await fetch(
                        CARD4ME_API +
                        "/api/flutterwave/verify/" +
                        encodeURIComponent(
                            payment.transactionId
                        ),
                        {
                            headers: {
                                Authorization:
                                    "Bearer " +
                                    localStorage.getItem("card4me_token")
                            }
                        }
                    );


                const data =
                    await response.json();



                /*
                 * PAYMENT VERIFIED
                 */

                if (
                    response.ok &&
                    data.success &&
                    data.verified
                ) {


                    paymentIcon.textContent =
                        "✅";


                    paymentTitle.textContent =
                        "Payment Successful";


                    paymentMessage.textContent =
                        "Your CARD4ME wallet has been updated successfully.";


                    paymentDetails.innerHTML = `

                        <p>

                            <strong>
                                Amount:
                            </strong>

                            ₦${Number(
                                data.amount ||
                                payment.amount ||
                                0
                            ).toLocaleString(
                                "en-NG",
                                {
                                    minimumFractionDigits: 2,
                                    maximumFractionDigits: 2
                                }
                            )}

                        </p>


                        <p>

                            <strong>
                                Reference:
                            </strong>

                            ${
                                data.reference ||
                                payment.reference ||
                                "N/A"
                            }

                        </p>


                        <p>

                            <strong>
                                Wallet Balance:
                            </strong>

                            ₦${Number(
                                data.balance ||
                                0
                            ).toLocaleString(
                                "en-NG",
                                {
                                    minimumFractionDigits: 2,
                                    maximumFractionDigits: 2
                                }
                            )}

                        </p>

                    `;


                    /*
                     * Show wallet button.
                     */

                    walletButton.style.display =
                        "inline-flex";


                    /*
                     * Remove temporary payment data
                     * after successful verification.
                     */

                    sessionStorage.removeItem(
                        "card4me_payment"
                    );


                    return;

                }



                /*
                 * PAYMENT NOT CONFIRMED
                 */

                paymentIcon.textContent =
                    "❌";


                paymentTitle.textContent =
                    "Payment Not Confirmed";


                paymentMessage.textContent =
                    data.message ||
                    "We could not confirm this payment.";


                paymentDetails.innerHTML = `

                    <p>
                        Your wallet has not been credited.
                    </p>

                    <p>
                        If you completed the payment,
                        please check your transaction
                        status or contact CARD4ME support.
                    </p>

                `;


            } catch (error) {


                console.error(
                    "Payment verification error:",
                    error
                );


                paymentIcon.textContent =
                    "⚠️";


                paymentTitle.textContent =
                    "Verification Error";


                paymentMessage.textContent =
                    "We could not connect to the CARD4ME payment server.";

            }

        }



        /*
         * START VERIFICATION
         */

        verifyPayment();

    </script>


</body>

</html>
