<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARD4ME News</title>
    <link rel="stylesheet" href="style.css?v=20260925">
    <style>
        .news-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 30px 18px 60px;
        }

        .news-hero {
            padding: 34px 24px;
            margin-bottom: 24px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(12, 30, 27, .96), rgba(7, 17, 25, .98));
            border: 1px solid rgba(80, 220, 160, .16);
            box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
        }

        .news-kicker {
            color: #5ee6a5;
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .news-hero h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 4vw, 2.7rem);
        }

        .news-hero p {
            margin: 0;
            max-width: 680px;
            color: var(--cm-text-muted, #9ba8ad);
            line-height: 1.7;
        }

        .news-status {
            margin: 16px 0;
            min-height: 20px;
            color: var(--cm-text-muted, #9ba8ad);
            font-size: .9rem;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .news-card {
            overflow: hidden;
            border-radius: 20px;
            background: rgba(13, 20, 25, .92);
            border: 1px solid rgba(255, 255, 255, .07);
            transition: transform 180ms ease, border-color 180ms ease;
        }

        .news-card:hover {
            transform: translateY(-3px);
            border-color: rgba(80, 220, 160, .3);
        }

        .news-cover {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            background: #11191d;
        }

        .news-cover-placeholder {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #10231f, #111a22);
            color: #5ee6a5;
            font-size: 2rem;
            font-weight: 800;
        }

        .news-card-body {
            padding: 18px;
        }

        .news-category {
            display: inline-flex;
            padding: 5px 9px;
            border-radius: 999px;
            background: rgba(80, 220, 160, .1);
            color: #5ee6a5;
            font-size: .7rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .news-card h2 {
            margin: 0 0 8px;
            font-size: 1.08rem;
            line-height: 1.4;
        }

        .news-summary {
            margin: 0 0 14px;
            color: var(--cm-text-muted, #9ba8ad);
            font-size: .88rem;
            line-height: 1.6;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: #75838a;
            font-size: .72rem;
        }

        .news-empty {
            padding: 50px 20px;
            text-align: center;
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, .1);
            color: var(--cm-text-muted, #9ba8ad);
        }

        @media (max-width: 900px) {
            .news-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 620px) {
            .news-page {
                padding: 20px 14px 40px;
            }

            .news-hero {
                padding: 26px 18px;
                border-radius: 20px;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }

            .news-cover,
            .news-cover-placeholder {
                height: 190px;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="logo">CARD4ME</div>

    <button
        type="button"
        class="menu-btn"
        onclick="toggleMenu()"
        aria-label="Open menu"
        aria-expanded="false"
    >☰</button>

    <nav id="mainNav">
        <a href="dashboard.html">Dashboard</a>
        <a href="wallet.html">Wallet</a>
        <a href="services.html">Services</a>
        <a href="transaction.html">Transactions</a>
        <a href="community.html">Community</a>
        <a href="news.html" class="active">News</a>
        <a href="account.html">Account</a>
        <a href="#" onclick="logoutUser(); return false;">Logout</a>
    </nav>
</header>

<main class="news-page">

    <section class="news-hero">
        <div class="news-kicker">CARD4ME Updates</div>
        <h1>Latest News</h1>
        <p>
            Stay updated with CARD4ME announcements, new features,
            digital services, community activities and important updates.
        </p>
    </section>

    <div id="newsStatus" class="news-status"></div>

    <section id="newsGrid" class="news-grid"></section>

    <div id="newsEmpty" class="news-empty" style="display:none;">
        No news articles have been published yet.
    </div>

</main>

<script src="app.js"></script>
<script src="news.js"></script>
<script src="script.js"></script>

</body>
</html>
