<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recover your CARD4ME account password">
    <title>Forgot Password — CARD4ME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-container">
        <section class="wallet-box">
            <small>ACCOUNT RECOVERY</small>

            <h1>Forgot Password?</h1>

            <p>
                Enter your registered email address.
                We will send you a secure password-reset link.
            </p>

            <form id="forgotPasswordForm">
                <label for="email">Email address</label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >

                <button class="btn" type="submit" id="forgotPasswordButton">
                    Send Reset Link
                </button>
            </form>

            <p id="forgotPasswordMessage" class="note"></p>

            <p class="note">
                <a href="login.html">Return to Login</a>
            </p>
        </section>
    </main>

    <script>
        const API_BASE =
            "https://card4me-backend-1.onrender.com";

        const form =
            document.getElementById("forgotPasswordForm");

        const button =
            document.getElementById("forgotPasswordButton");

        const message =
            document.getElementById("forgotPasswordMessage");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Sending...";
            message.textContent = "";

            try {
                const response = await fetch(
                    `${API_BASE}/api/auth/forgot-password`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: document
                                .getElementById("email")
                                .value
                                .trim()
                        })
                    }
                );

                const data = await response.json();

                message.textContent =
                    data.message ||
                    "If the email exists, a reset link will be sent.";

            } catch (error) {
                message.textContent =
                    "Unable to process your request. Please try again.";
            } finally {
                button.disabled = false;
                button.textContent = "Send Reset Link";
            }
        });
    </script>

</body>
</html>
