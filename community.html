<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Community | CARD4ME</title>

    <meta
        name="description"
        content="Connect, communicate and stay updated with the CARD4ME community."
    >

    <link
        rel="stylesheet"
        href="style.css?v=20260925"
    >

    <style>
        .community-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 18px 70px;
        }

        .community-hero {
            margin-bottom: 24px;
        }

        .community-hero h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
        }

        .community-hero p {
            margin: 0;
            color: var(--cm-text-muted, #94a3b8);
            line-height: 1.6;
        }

        .community-layout {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 18px;
        }

        .community-card {
            background: rgba(10, 18, 30, .88);
            border: 1px solid rgba(45, 212, 191, .14);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
        }

        .community-channels {
            padding: 14px;
        }

        .community-section-title {
            padding: 8px 10px 12px;
            font-size: .76rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--cm-text-muted, #94a3b8);
        }

        .channel-button {
            width: 100%;
            border: 0;
            background: transparent;
            color: inherit;
            text-align: left;
            padding: 13px 12px;
            border-radius: 14px;
            cursor: pointer;
            margin-bottom: 5px;
        }

        .channel-button:hover,
        .channel-button.active {
            background: rgba(20, 184, 166, .10);
        }

        .channel-button.active {
            border: 1px solid rgba(20, 184, 166, .22);
        }

        .channel-name {
            display: block;
            font-weight: 750;
            margin-bottom: 4px;
        }

        .channel-description {
            display: block;
            font-size: .75rem;
            line-height: 1.4;
            color: var(--cm-text-muted, #94a3b8);
        }

        .chat-card {
            min-height: 620px;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, .07);
        }

        .chat-header h2 {
            margin: 0 0 5px;
            font-size: 1.05rem;
        }

        .chat-header p {
            margin: 0;
            color: var(--cm-text-muted, #94a3b8);
            font-size: .82rem;
        }

        .messages {
            flex: 1;
            min-height: 430px;
            max-height: 520px;
            overflow-y: auto;
            padding: 18px;
        }

        .message {
            margin-bottom: 14px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: .75rem;
        }

        .message-name {
            font-weight: 750;
        }

        .message-time {
            color: var(--cm-text-muted, #94a3b8);
        }

        .message-body {
            display: inline-block;
            max-width: 90%;
            padding: 10px 13px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .055);
            line-height: 1.5;
            word-break: break-word;
        }

        .empty-community {
            height: 100%;
            min-height: 400px;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--cm-text-muted, #94a3b8);
            padding: 30px;
        }

        .message-form {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid rgba(255, 255, 255, .07);
        }

        .message-input {
            flex: 1;
            min-width: 0;
            border: 1px solid rgba(255, 255, 255, .10);
            background: rgba(0, 0, 0, .22);
            color: inherit;
            border-radius: 14px;
            padding: 13px 14px;
            outline: none;
        }

        .message-input:focus {
            border-color: rgba(20, 184, 166, .45);
        }

        .message-send {
            border: 0;
            border-radius: 14px;
            padding: 0 18px;
            background: #16a34a;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }

        .message-send:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .community-status {
            padding: 10px 18px;
            font-size: .8rem;
            color: var(--cm-text-muted, #94a3b8);
        }

        @media (max-width: 760px) {
            .community-page {
                padding: 24px 12px 55px;
            }

            .community-layout {
                grid-template-columns: 1fr;
            }

            .community-channels {
                display: flex;
                gap: 8px;
                overflow-x: auto;
            }

            .community-section-title {
                display: none;
            }

            .channel-button {
                flex: 0 0 190px;
                margin: 0;
            }

            .chat-card {
                min-height: 570px;
            }

            .messages {
                min-height: 380px;
                max-height: none;
            }

            .message-form {
                position: sticky;
                bottom: 0;
            }
        }

/* COMMUNITY NEWS */

.community-news-card {
    overflow: hidden;
    border: 1px solid #183b3e;
    border-radius: 16px;
    background: #0b292d;
    margin-bottom: 18px;
}

.community-news-image {
    display: block;
    width: 100%;
    max-height: 280px;
    object-fit: cover;
}

.community-news-content {
    padding: 20px;
}

.community-news-category {
    display: inline-block;
    margin-bottom: 9px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(115,213,204,.10);
    color: #73d5cc;
    font-size: 12px;
    font-weight: 800;
}

.community-news-card h3 {
    margin: 0 0 10px;
    color: #ffffff;
    font-size: 22px;
    line-height: 1.3;
}

.community-news-summary {
    margin: 0 0 12px;
    color: #b7c8ca;
    line-height: 1.6;
}

.community-news-meta {
    margin-bottom: 18px;
    color: #789295;
    font-size: 13px;
}

.community-news-body {
    color: #d8e4e5;
    line-height: 1.75;
    font-size: 15px;
}

.community-event-card {
    overflow: hidden;
    margin-bottom: 18px;
    border: 1px solid rgba(45, 212, 191, .14);
    border-radius: 18px;
    background: rgba(255, 255, 255, .035);
}

.community-event-image {
    display: block;
    width: 100%;
    max-height: 280px;
    object-fit: cover;
}

.community-event-content {
    padding: 20px;
}

.community-event-badge {
    display: inline-block;
    margin-bottom: 10px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(20, 184, 166, .10);
    color: #73d5cc;
    font-size: 12px;
    font-weight: 800;
}

.community-event-card h3 {
    margin: 0 0 10px;
    color: #fff;
    font-size: 22px;
    line-height: 1.3;
}

.community-event-description {
    margin: 0 0 18px;
    color: #b7c8ca;
    line-height: 1.65;
}

.community-event-details {
    display: grid;
    gap: 9px;
    margin-bottom: 18px;
}

.community-event-details div {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #d8e4e5;
    font-size: 14px;
}

.community-event-details span {
    min-width: 22px;
}

.community-event-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.community-event-join,
.community-event-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 10px 16px;
    border-radius: 12px;
    font-weight: 800;
    text-decoration: none;
}

.community-event-join {
    border: 0;
    background: #16a34a;
    color: #fff;
    cursor: pointer;
}

.community-event-join:hover:not(:disabled) {
    filter: brightness(1.08);
}

.community-event-join:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.community-event-link {
    border: 1px solid rgba(45, 212, 191, .22);
    background: rgba(20, 184, 166, .08);
    color: #73d5cc;
}

</style>
</head>

<body class="auth-checking">

<header>
    <nav class="nav">

        <a
            href="dashboard.html"
            class="logo"
            aria-label="CARD4ME Dashboard"
        >
            <span class="logo-mark">C4</span>
            CARD<span>4</span>ME
        </a>

        <button
            class="menu"
            type="button"
            aria-label="Open navigation menu"
        >
            ☰
        </button>

        <div
            class="nav-links"
            id="nav"
        >
            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="airtime.html">
                Airtime
            </a>

            <a href="data.html">
                Data
            </a>

            <a href="wallet.html">
                Wallet
            </a>

            <a href="transaction.html">
                Transactions
            </a>

            <a href="ai-help.html">
                🤖 AI Help
            </a>

            <a
                href="community.html"
                class="active"
            >
                Community
            </a>

            <a href="account.html">
                Account
            </a>

            <a
                href="#"
                onclick="logout(); return false;"
            >
                Logout
            </a>
        </div>

    </nav>
</header>


<main class="community-page">

    <section class="community-hero">
        <h1>CARD4ME Community</h1>

        <p>
            Connect with other CARD4ME users, follow official updates
            and stay close to upcoming activities.
        </p>
    </section>


    <section class="community-layout">

        <aside class="community-card community-channels">

            <div class="community-section-title">
                Spaces
            </div>

            <div id="channelsList">
                <div class="community-status">
                    Loading community...
                </div>
            </div>

        </aside>


        <section class="community-card chat-card">

            <div class="chat-header">
                <h2 id="channelTitle">
                    CARD4ME Community
                </h2>

                <p id="channelDescription">
                    Loading...
                </p>
            </div>


            <div
                id="messages"
                class="messages"
            >
                <div class="empty-community">
                    Loading messages...
                </div>
            </div>


            <div
                id="communityStatus"
                class="community-status"
            ></div>


            <form
                id="messageForm"
                class="message-form"
            >
                <input
                    id="messageInput"
                    class="message-input"
                    type="text"
                    maxlength="2000"
                    autocomplete="off"
                    placeholder="Write a message..."
                    required
                >

                <button
                    id="messageSend"
                    class="message-send"
                    type="submit"
                >
                    Send
                </button>
            </form>

        </section>

    </section>

</main>


<script src="app.js"></script>

<script src="community.js"></script>

<script src="script.js"></script>

</body>
</html>
