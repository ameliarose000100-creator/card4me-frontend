<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>Owner Earnings - CARD4ME</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        .owner-page {
            width: min(1160px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 70px;
        }

        .owner-header {
            margin-bottom: 30px;
        }

        .owner-header h1 {
            font-size: clamp(28px, 5vw, 42px);
            margin-bottom: 8px;
        }

        .owner-header p {
            color: #9fb4b7;
        }

        .earnings-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .earnings-card {
            padding: 24px;
            border: 1px solid #15363a;
            border-radius: 16px;
            background: rgba(7, 25, 29, 0.88);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
        }

        .earnings-card p {
            color: #8fa7aa;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .earnings-card h2 {
            font-size: 25px;
            color: #ffffff;
        }

        .owner-section {
            margin-top: 28px;
            padding: 24px;
            border: 1px solid #15363a;
            border-radius: 16px;
            background: rgba(7, 25, 29, 0.88);
            overflow-x: auto;
        }

        .owner-section h2 {
            margin-bottom: 18px;
        }

        .breakdown-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .breakdown-card {
            padding: 20px;
            border-radius: 12px;
            background: rgba(12, 40, 41, 0.65);
            border: 1px solid #15363a;
        }

        .breakdown-card h3 {
            margin-bottom: 8px;
        }

        .breakdown-card p {
            color: #9fb4b7;
        }

        .earnings-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .earnings-table th,
        .earnings-table td {
            padding: 13px 12px;
            text-align: left;
            border-bottom: 1px solid #15363a;
            white-space: nowrap;
        }

        .earnings-table th {
            color: #9fb4b7;
            font-size: 13px;
            font-weight: 600;
        }

        .earnings-table td {
            color: #ffffff;
            font-size: 14px;
        }

        .profit-positive {
            font-weight: 700;
        }

        .empty-history {
            color: #8fa7aa;
            padding: 20px 0;
        }

        .owner-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .owner-actions button {
            padding: 11px 18px;
            border: 1px solid #1a7770;
            border-radius: 9px;
            background: #0d3837;
            color: #ffffff;
        }

        .owner-actions button:hover {
            background: #124744;
        }

        @media (max-width: 850px) {
            .earnings-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 520px) {
            .owner-page {
                width: min(100% - 24px, 1160px);
                padding-top: 28px;
            }

            .earnings-grid {
                grid-template-columns: 1fr;
            }

            .breakdown-grid {
                grid-template-columns: 1fr;
            }

            .owner-section {
                padding: 18px;
            }
        }
    </style>

</head>

<body>

<header class="site-header">

    <div class="logo">
        CARD4ME
    </div>

    <button
        type="button"
        class="menu-btn"
        onclick="toggleMenu()"
        aria-label="Open menu"
    >
        ☰
    </button>

    <nav id="mainNav">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="wallet.html">
            Wallet
        </a>

        <a href="transaction.html">
            Transactions
        </a>

        <button
            type="button"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </nav>

</header>


<main class="owner-page">

    <section class="owner-header">

        <h1>
            Owner Earnings
        </h1>

        <p>
            Monitor CARD4ME sales, provider costs and business profit.
        </p>

        <div class="owner-actions">

            <button
                type="button"
                onclick="loadEarnings()"
            >
                Refresh Earnings
            </button>

        </div>

    </section>


    <section class="earnings-grid">

        <div class="earnings-card">
            <p>Total Sales</p>
            <h2 id="totalSales">₦0.00</h2>
        </div>

        <div class="earnings-card">
            <p>Provider Cost</p>
            <h2 id="providerCost">₦0.00</h2>
        </div>

        <div class="earnings-card">
            <p>Total Profit</p>
            <h2 id="totalProfit">₦0.00</h2>
        </div>

        <div class="earnings-card">
            <p>Transactions</p>
            <h2 id="totalTransactions">0</h2>
        </div>

    </section>


    <section class="owner-section">

        <h2>
            Profit Breakdown
        </h2>

        <div
            id="breakdown"
            class="breakdown-grid"
        >
            <p class="empty-history">
                Loading...
            </p>
        </div>

    </section>


    <section class="owner-section">

        <h2>
            Earnings History
        </h2>

        <div id="historyContainer">

            <p class="empty-history">
                Loading earnings history...
            </p>

        </div>

    </section>

</main>


<script src="app.js"></script>

<script>

function formatNaira(value) {

    const number = Number(value || 0);

    return "₦" + number.toLocaleString(
        "en-NG",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}


function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent = value ?? "";

    return div.innerHTML;
}


async function loadEarnings() {

    try {

        const response =
            await apiRequest("/api/admin/earnings");

        if (!response.success) {

            throw new Error(
                response.message ||
                "Unable to load earnings."
            );
        }


        const earnings =
            response.earnings || {};

        document.getElementById(
            "totalSales"
        ).textContent =
            formatNaira(earnings.total_sales);


        document.getElementById(
            "providerCost"
        ).textContent =
            formatNaira(earnings.total_provider_cost);


        document.getElementById(
            "totalProfit"
        ).textContent =
            formatNaira(earnings.total_profit);


        document.getElementById(
            "totalTransactions"
        ).textContent =
            Number(
                earnings.total_transactions || 0
            ).toLocaleString("en-NG");


        renderBreakdown(
            response.breakdown || []
        );


        await loadHistory();

    } catch (error) {

        console.error(
            "Owner earnings error:",
            error
        );

        showCard4MeAlert(
            error.message ||
            "Unable to load owner earnings.",
            "error",
            "Owner Dashboard"
        );
    }
}


function renderBreakdown(rows) {

    const container =
        document.getElementById("breakdown");


    if (!rows.length) {

        container.innerHTML = `
            <p class="empty-history">
                No completed earnings yet.
            </p>
        `;

        return;
    }


    container.innerHTML =
        rows.map(row => {

            const type =
                String(row.type || "")
                .toUpperCase();


            return `
                <div class="breakdown-card">

                    <h3>
                        ${escapeHtml(type)}
                    </h3>

                    <p>
                        Transactions:
                        ${Number(row.transactions || 0).toLocaleString("en-NG")}
                    </p>

                    <p>
                        Profit:
                        <strong>
                            ${formatNaira(row.profit)}
                        </strong>
                    </p>

                </div>
            `;

        }).join("");
}


async function loadHistory() {

    const container =
        document.getElementById(
            "historyContainer"
        );


    try {

        const response =
            await apiRequest(
                "/api/admin/earnings/history"
            );


        if (!response.success) {

            throw new Error(
                response.message ||
                "Unable to load earnings history."
            );
        }


        const rows =
            response.earnings || [];


        if (!rows.length) {

            container.innerHTML = `
                <p class="empty-history">
                    No completed earnings yet.
                </p>
            `;

            return;
        }


        container.innerHTML = `

            <table class="earnings-table">

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Customer Paid</th>
                        <th>Provider Cost</th>
                        <th>Profit</th>
                        <th>Reference</th>
                    </tr>

                </thead>

                <tbody>

                    ${rows.map(row => `

                        <tr>

                            <td>
                                ${escapeHtml(
                                    row.created_at
                                    ? new Date(row.created_at)
                                        .toLocaleString("en-NG")
                                    : "-"
                                )}
                            </td>

                            <td>
                                ${escapeHtml(row.type || "-")}
                            </td>

                            <td>
                                ${formatNaira(
                                    row.customer_amount
                                )}
                            </td>

                            <td>
                                ${formatNaira(
                                    row.provider_cost
                                )}
                            </td>

                            <td class="profit-positive">
                                ${formatNaira(
                                    row.profit
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    row.reference || "-"
                                )}
                            </td>

                        </tr>

                    `).join("")}

                </tbody>

            </table>
        `;

    } catch (error) {

        console.error(
            "Owner history error:",
            error
        );

        container.innerHTML = `
            <p class="empty-history">
                Unable to load earnings history.
            </p>
        `;

    }
}


document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (
            typeof requireLogin ===
            "function"
        ) {
            requireLogin();
        }

        loadEarnings();

    }
);

</script>

</body>

</html>


<hr>

<h2>Owner Withdrawal</h2>

<input id="withdrawAmount" placeholder="Amount" type="number">

<select id="withdrawBank">
    <option value="">Select Bank</option>
</select>

<input id="withdrawAccount" placeholder="Account Number">

<button onclick="withdrawMoney()">
    Withdraw
</button>

<p id="withdrawResult"></p>


<script>
const token = localStorage.getItem("token");

async function loadBanks(){

    const res = await fetch(
        "https://card4me-backend-1.onrender.com/api/banks",
        {
            headers:{
                Authorization:"Bearer " + token
            }
        }
    );

    const data = await res.json();

    const select =
        document.getElementById("withdrawBank");

    data.banks.forEach(bank=>{

        const option =
        document.createElement("option");

        option.value = bank.code;
        option.textContent = bank.name;

        select.appendChild(option);

    });

}


async function withdrawMoney(){

    const body = {
        amount:
        Number(document.getElementById("withdrawAmount").value),

        bank_code:
        document.getElementById("withdrawBank").value,

        account_number:
        document.getElementById("withdrawAccount").value
    };


    const res = await fetch(
        "https://card4me-backend-1.onrender.com/api/admin/withdraw",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                Authorization:"Bearer " + token
            },
            body:JSON.stringify(body)
        }
    );


    const data = await res.json();

    document.getElementById("withdrawResult")
    .textContent =
    JSON.stringify(data);

}


loadBanks();

</script>
